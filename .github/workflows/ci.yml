name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一分支的新推送取消仍在跑的旧运行；main 不取消，保证每个合并点都有完整记录
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # 项目策略是 0 vulnerabilities；--audit-level=low 让任何等级的新漏洞都直接失败
      - name: audit
        run: npm audit --audit-level=low
